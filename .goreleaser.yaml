# GoReleaser v2 — one build, published as both `ilmctl` and `kubectl-ilm`.
# Supply chain: checksums, cosign blob signatures, syft SBOM.
# Packaging: nfpm (.deb/.rpm), Homebrew tap, scoop bucket, chocolatey, krew.
# Public indexes (homebrew-core, krew-index, chocolatey community) are HELD
# pending the ILM trademark; manifests publish only to the org namespace.
#
# Package-manager UPLOADS are held too, until their targets exist: none of
# OmniTrustILM/{homebrew-tap,scoop-bucket,krew-index} is created yet. Those
# three blocks still render their manifests into dist/, so the shape stays
# reviewable; drop the skip_upload lines — and wire a cross-repo token into each
# repository block — once the target repositories exist.
#
# The chocolatey block renders nothing: its pipe shells out to a `choco` binary
# the Linux release runner does not carry, so it is skipped outright by both
# release.yml and `make release-snapshot` until there is a chocolatey channel.
version: 2

project_name: ilmctl

before:
  hooks:
    - go mod tidy

builds:
  - id: ilmctl
    main: ./cmd/ilmctl
    binary: ilmctl
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/OmniTrustILM/cli/internal/buildinfo.GitVersion={{.Version}}
      - -X github.com/OmniTrustILM/cli/internal/buildinfo.GitCommit={{.FullCommit}}
      - -X github.com/OmniTrustILM/cli/internal/buildinfo.BuildDate={{.Date}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

# Two archives from the SAME build artifact: one named ilmctl, one kubectl-ilm.
# The kubectl-ilm archive ships the binary with the plugin name so `tar -xf`
# yields `kubectl-ilm` on $PATH, satisfying `kubectl plugin list`.
archives:
  - id: ilmctl
    ids: [ilmctl]
    name_template: "ilmctl_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - docs/**/*
  - id: kubectl-ilm
    ids: [ilmctl]
    name_template: "kubectl-ilm_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: false
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Detached key-based signature over checksums.txt, verifiable with
#   cosign verify-blob --key cosign.pub --signature checksums.txt.sig checksums.txt
# cosign v3 defaults to the TUF signing-config path and the new bundle format,
# both of which demand --bundle; without the two opt-outs below it refuses with
# "must provide --bundle with --signing-config or --use-signing-config". The
# flags are verified against cosign v3.0.2, which release.yml pins.
signs:
  - cmd: cosign
    artifacts: checksum
    args:
      - sign-blob
      - "--key=env://COSIGN_PRIVATE_KEY"
      - "--use-signing-config=false"
      - "--new-bundle-format=false"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"

sboms:
  - artifacts: archive

nfpms:
  - id: ilmctl
    package_name: ilmctl
    ids: [ilmctl]
    formats: [deb, rpm]
    vendor: OmniTrust ILM
    homepage: https://github.com/OmniTrustILM/cli
    maintainer: OmniTrust ILM <support@omnitrust.com>
    description: Command-line interface for OmniTrust ILM (ilmctl / kubectl ilm).
    license: MIT
    bindir: /usr/bin

homebrew_casks:
  - name: ilmctl
    ids: [ilmctl]
    skip_upload: "true"
    repository:
      owner: OmniTrustILM
      name: homebrew-tap
    homepage: https://github.com/OmniTrustILM/cli
    description: Command-line interface for OmniTrust ILM.
    hooks:
      post:
        install: |
          system "ln", "-sf", "#{staged_path}/ilmctl", "#{staged_path}/kubectl-ilm"

scoops:
  - name: ilmctl
    ids: [ilmctl]
    skip_upload: "true"
    repository:
      owner: OmniTrustILM
      name: scoop-bucket
    homepage: https://github.com/OmniTrustILM/cli
    description: Command-line interface for OmniTrust ILM.
    license: MIT

chocolateys:
  - name: ilmctl
    ids: [ilmctl]
    title: OmniTrust ILM CLI
    authors: OmniTrust ILM
    project_url: https://github.com/OmniTrustILM/cli
    license_url: https://github.com/OmniTrustILM/cli/blob/main/LICENSE
    summary: Command-line interface for OmniTrust ILM.
    description: |
      ilmctl / kubectl ilm — install, operate, troubleshoot and diagnose
      OmniTrust ILM on Kubernetes.
    source_repo: "https://nuget.omnitrustregistry.com/v3/index.json"

# Renders .krew.yaml for our custom krew index (submission to krew-index held).
krews:
  - name: ilm
    ids: [ilmctl, kubectl-ilm]
    skip_upload: "true"
    repository:
      owner: OmniTrustILM
      name: krew-index
    homepage: https://github.com/OmniTrustILM/cli
    short_description: Install, operate and diagnose OmniTrust ILM.
    description: |
      The kubectl plugin for OmniTrust ILM: install the operator, generate and
      inspect Platform/Connector/Proxy resources, and collect diagnostics.

release:
  github:
    owner: OmniTrustILM
    name: cli
  draft: false
  prerelease: auto

snapshot:
  version_template: "{{ .Tag }}-next"
