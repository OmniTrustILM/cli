sonar.projectKey=OmniTrustILM_cli
sonar.organization=ilm

# Source and test configuration
sonar.sources=cmd,internal
sonar.tests=internal
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/*_test.go,**/zz_generated*.go,test/**

# Coverage
sonar.go.coverage.reportPaths=cover.out

# Lint report (golangci-lint checkstyle format)
sonar.go.golangci-lint.reportPaths=golangci-lint-report.xml

# Quality gate
sonar.qualitygate.wait=true

# Duplication
sonar.cpd.minimumTokens=100

# Ignore rules
# S1135 (resolve TODO comments) in the platform scaffolder: the "TODO" markers
# document the placeholder values the generator intentionally EMITS into the
# scaffolded CR (hostname, TLS credentials, bootstrap secret) so the user
# replaces them. They describe a feature, not outstanding work.
sonar.issue.ignore.multicriteria=todogen,todogentest
sonar.issue.ignore.multicriteria.todogen.ruleKey=go:S1135
sonar.issue.ignore.multicriteria.todogen.resourceKey=internal/generate/platform.go
sonar.issue.ignore.multicriteria.todogentest.ruleKey=go:S1135
sonar.issue.ignore.multicriteria.todogentest.resourceKey=internal/generate/render_test.go
